# Weekly updates, grouped so this repo does not get one PR per crate
# (see dentiny/slatefs#10 / dentiny/duckdb-object-storage#26).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - slatedb
          - slatedb-*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
