[package]
name = "slatedb-fs"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "SlateDB-backed DuckDB filesystem"

[lib]
name = "slatedb_fs"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3.2"

[dependencies]
# https://slatedb.io/ — embedded LSM on object storage.
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
object_store = "0.14"
object_store_opendal = { version = "=0.60.1", features = ["services-s3"] }
opendal = { version = "=0.59.1", default-features = false, features = ["executors-tokio", "http-transport-reqwest", "services-fs", "services-memory", "services-s3"] }
prost = "0.14"
slatedb = { version = "0.16", default-features = false, features = ["foyer"] }
slatedb-common = "0.16"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }

[dev-dependencies]
hyper-util = { version = "0.1", features = ["server-auto", "http1", "http2", "tokio"] }
s3s = "0.16"
s3s-fs = "0.16"
tempfile = "3"
tokio = { version = "1", features = ["net", "time"] }
