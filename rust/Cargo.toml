[package]
name = "slatedb-fs"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "SlateDB-backed DuckDB filesystem (dummy implementation)"

[lib]
name = "slatedb_fs"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3.2"

[dependencies]
# https://slatedb.io/ — embedded LSM on object storage.
# default-features (aws, foyer) are left off for a lighter compile while the VFS is dummy.
anyhow = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }
prost = "0.14"
slatedb = { version = "0.15", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
